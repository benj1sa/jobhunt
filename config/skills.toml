# Canonical skill name = list of aliases (matched case-insensitively after trimming).
# Unknown skills are kept as extracted, title-cased only when fully lowercase.
# Add an alias here whenever `jobhunt skills` shows the same skill twice.

[aliases]
"Python" = ["python3", "py"]
"JavaScript" = ["js", "javascript/es6", "ecmascript"]
"TypeScript" = ["ts"]
"C++" = ["cpp", "c plus plus"]
"Go" = ["golang"]
"PyTorch" = ["torch", "pytorch lightning"]
"TensorFlow" = ["tf", "tensorflow 2"]
"Machine Learning" = ["ml", "machine-learning"]
"Deep Learning" = ["dl", "deep-learning"]
"Large Language Models" = ["llm", "llms", "large language model", "genai", "generative ai"]
"Retrieval-Augmented Generation" = ["rag"]
"Natural Language Processing" = ["nlp"]
"Computer Vision" = ["cv"]
"MLOps" = ["ml ops", "ml-ops"]
"Kubernetes" = ["k8s"]
"Amazon Web Services" = ["aws", "amazon aws"]
"Google Cloud" = ["gcp", "google cloud platform"]
"Microsoft Azure" = ["azure"]
"CI/CD" = ["ci", "cd", "continuous integration", "ci / cd"]
"PostgreSQL" = ["postgres", "psql"]
"SQL" = ["sql databases"]
"REST APIs" = ["rest", "restful apis", "rest api", "restful"]
"Node.js" = ["node", "nodejs"]
"React" = ["react.js", "reactjs"]
"Next.js" = ["nextjs", "next"]
"Linux" = ["unix/linux", "linux/unix"]
"Git" = ["github", "version control"]
"Docker" = ["containers", "containerization"]
"Data Structures and Algorithms" = ["data structures", "algorithms", "dsa"]
