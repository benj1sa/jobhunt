# Capabilities: what postings expect you to DO, as opposed to which tools you know.
#
# Extraction copies each responsibility / expectation phrase from a posting word for word and tags it with
# one to three capability ids from this file (or "other"). `jobhunt capabilities` counts them across jobs and
# `jobhunt capabilities show <id>` lists every phrase behind one capability.
#
# Seeded from 6,169 bullet lines in 364 relevant jobs (2026-11-05). The examples are real phrases from those
# postings and are shown to the model, so keep them short and typical. After editing ids or descriptions, run
# `jobhunt extract --rerun` to re-tag existing jobs.

[[capability]]
id = "customer_iteration"
name = "Customer-facing iteration"
description = "Talking to customers or users, understanding their problems, and turning feedback into product changes."
examples = [
  "Iterate rapidly to improve Chalk's platform in response to customer needs",
  "Turn customer feedback into small, meaningful improvements",
  "You talk to users, get feedback, and iterate fast.",
]

