# Skill groups: turns ~1,000 raw skill names into a two-level view.
#
#   [groups.<id>]   a family of related skills, e.g. "Cloud platforms"
#   [skills]        "<skill as extracted>" = { group = "<id>", kind = "concept" | "tool", same_as = "<skill>" }
#
# kind = "concept" for broad areas or practices ("Machine Learning", "Security", "Distributed systems")
# kind = "tool" for anything you could install, call or name on a resume ("PyTorch", "SageMaker", "gRPC")
# same_as merges spellings of one thing ("Apache Spark" -> "Spark"). Matching ignores case and punctuation.
#
# Unmapped skills show up in `jobhunt skills --unsorted`. `jobhunt skills classify` asks the LLM to
# propose entries for them and appends the proposals at the end of this file for you to review.

