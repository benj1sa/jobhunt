name: Job Pipeline

# Manual discovery run (Actions tab -> Job Pipeline -> Run workflow). Produces jobhunt.db on the `data` branch;
# review happens locally after `make pull-data`. The nightly schedule is off: jobhunt runs on the laptop instead.
# To turn it back on, add under `on:`
#   schedule:
#     - cron: "17 11 * * *"   # 6:17 AM Eastern
# Secrets: OPENROUTER_API_KEY for extraction (without it the run stops after hydration);
# optional TYPESAFE_API_KEY to screen descriptions with Jev before extraction.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch every open job to detect closed postings"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-pipeline
  cancel-in-progress: false

env:
  COLUMNS: 160
  DATABASE_URL: sqlite:///data/jobhunt.db

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Check out data branch
        id: data
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: data
          path: data

      - name: Start data branch on first run
        if: steps.data.outcome == 'failure'
        run: |
          rm -rf data
          mkdir data
          git -C data init -b data
          git -C data remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install Dependencies
        run: make install

      - name: Migrate database
        run: uv run jobhunt migrate

      - name: Refresh board seeds (Sundays or on request)
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            uv run jobhunt boards seed
          fi

      - name: Run pipeline (ingest, resolve, hydrate, screen, extract)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run jobhunt run --skip-score

      - name: Weekly refresh
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event.inputs.refresh }}" = "true" ]; then
            uv run jobhunt hydrate --refresh
          fi

      - name: Source health
        id: health
        continue-on-error: true
        run: uv run jobhunt health --strict

      - name: Publish database to data branch
        if: always()
        working-directory: data
        run: |
          test -f jobhunt.db || { echo "No database produced"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobhunt.db
          # One commit, force-pushed: the branch never accumulates binary history.
          git commit --quiet --amend -m "Pipeline run ${{ github.run_id }}" 2>/dev/null || git commit --quiet -m "Pipeline run ${{ github.run_id }}"
          git push --force origin HEAD:data

      - name: Fail if a source is unhealthy
        if: steps.health.outcome == 'failure'
        run: |
          echo "::warning::One or more sources returned errors or zero leads three runs in a row. See the Source health step."
          exit 1
